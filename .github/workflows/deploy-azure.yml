name: Deploy Intelligence Ingestor to Azure

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  AZURE_WEBAPP_NAME: intelligence-ingestor-app
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  CONTAINER_REGISTRY: intelligenceingestorregistry
  RESOURCE_GROUP: intelligence-ingestor-rg

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Run tests
      run: |
        # Create a simple test to verify imports work
        python -c "
        import sys
        try:
            from main import app
            from utils.chroma_client import chroma_manager
            from utils.chunking import chunker
            print('✅ All imports successful')
            sys.exit(0)
        except Exception as e:
            print(f'❌ Import failed: {e}')
            sys.exit(1)
        "

  build-and-deploy-staging:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Create Resource Group
      run: |
        az group create \
          --name ${{ env.RESOURCE_GROUP }}-staging \
          --location eastus

    - name: Create Azure Container Registry
      run: |
        az acr create \
          --resource-group ${{ env.RESOURCE_GROUP }}-staging \
          --name ${{ env.CONTAINER_REGISTRY }}staging \
          --sku Basic \
          --admin-enabled true

    - name: Build and push Docker image
      run: |
        az acr build \
          --registry ${{ env.CONTAINER_REGISTRY }}staging \
          --image intelligence-ingestor:${{ github.sha }} \
          --image intelligence-ingestor:latest \
          .

    - name: Create App Service Plan
      run: |
        az appservice plan create \
          --name ${{ env.AZURE_WEBAPP_NAME }}-plan-staging \
          --resource-group ${{ env.RESOURCE_GROUP }}-staging \
          --is-linux \
          --sku B1

    - name: Create Web App
      run: |
        az webapp create \
          --resource-group ${{ env.RESOURCE_GROUP }}-staging \
          --plan ${{ env.AZURE_WEBAPP_NAME }}-plan-staging \
          --name ${{ env.AZURE_WEBAPP_NAME }}-staging \
          --deployment-container-image-name ${{ env.CONTAINER_REGISTRY }}staging.azurecr.io/intelligence-ingestor:${{ github.sha }}

    - name: Configure Web App
      run: |
        # Get ACR credentials
        ACR_USERNAME=$(az acr credential show --name ${{ env.CONTAINER_REGISTRY }}staging --query username --output tsv)
        ACR_PASSWORD=$(az acr credential show --name ${{ env.CONTAINER_REGISTRY }}staging --query passwords[0].value --output tsv)
        ACR_LOGIN_SERVER=${{ env.CONTAINER_REGISTRY }}staging.azurecr.io

        # Configure container settings
        az webapp config container set \
          --name ${{ env.AZURE_WEBAPP_NAME }}-staging \
          --resource-group ${{ env.RESOURCE_GROUP }}-staging \
          --docker-custom-image-name $ACR_LOGIN_SERVER/intelligence-ingestor:${{ github.sha }} \
          --docker-registry-server-url https://$ACR_LOGIN_SERVER \
          --docker-registry-server-user $ACR_USERNAME \
          --docker-registry-server-password $ACR_PASSWORD

        # Configure app settings
        az webapp config appsettings set \
          --resource-group ${{ env.RESOURCE_GROUP }}-staging \
          --name ${{ env.AZURE_WEBAPP_NAME }}-staging \
          --settings \
            BEARER_TOKEN="${{ secrets.BEARER_TOKEN_STAGING }}" \
            CHROMA_API_KEY="${{ secrets.CHROMA_API_KEY }}" \
            CHROMA_TENANT="${{ secrets.CHROMA_TENANT }}" \
            CHROMA_DATABASE="${{ secrets.CHROMA_DATABASE }}" \
            WEBSITES_PORT=8000 \
            ENVIRONMENT=staging

    - name: Test Staging Deployment
      run: |
        # Wait for app to start
        sleep 60

        # Test health endpoint
        STAGING_URL="https://${{ env.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net"
        echo "Testing staging deployment at: $STAGING_URL"

        curl -f "$STAGING_URL/health" || exit 1
        echo "✅ Staging deployment successful!"

  build-and-deploy-production:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Create Resource Group
      run: |
        az group create \
          --name ${{ env.RESOURCE_GROUP }} \
          --location eastus

    - name: Create Azure Container Registry
      run: |
        az acr create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.CONTAINER_REGISTRY }} \
          --sku Standard \
          --admin-enabled true

    - name: Build and push Docker image
      run: |
        az acr build \
          --registry ${{ env.CONTAINER_REGISTRY }} \
          --image intelligence-ingestor:${{ github.sha }} \
          --image intelligence-ingestor:latest \
          .

    - name: Create App Service Plan
      run: |
        az appservice plan create \
          --name ${{ env.AZURE_WEBAPP_NAME }}-plan \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --is-linux \
          --sku S1

    - name: Create Web App
      run: |
        az webapp create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --plan ${{ env.AZURE_WEBAPP_NAME }}-plan \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --deployment-container-image-name ${{ env.CONTAINER_REGISTRY }}.azurecr.io/intelligence-ingestor:${{ github.sha }}

    - name: Configure Web App
      run: |
        # Get ACR credentials
        ACR_USERNAME=$(az acr credential show --name ${{ env.CONTAINER_REGISTRY }} --query username --output tsv)
        ACR_PASSWORD=$(az acr credential show --name ${{ env.CONTAINER_REGISTRY }} --query passwords[0].value --output tsv)
        ACR_LOGIN_SERVER=${{ env.CONTAINER_REGISTRY }}.azurecr.io

        # Configure container settings
        az webapp config container set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --docker-custom-image-name $ACR_LOGIN_SERVER/intelligence-ingestor:${{ github.sha }} \
          --docker-registry-server-url https://$ACR_LOGIN_SERVER \
          --docker-registry-server-user $ACR_USERNAME \
          --docker-registry-server-password $ACR_PASSWORD

        # Configure app settings
        az webapp config appsettings set \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --settings \
            BEARER_TOKEN="${{ secrets.BEARER_TOKEN_PRODUCTION }}" \
            CHROMA_API_KEY="${{ secrets.CHROMA_API_KEY }}" \
            CHROMA_TENANT="${{ secrets.CHROMA_TENANT }}" \
            CHROMA_DATABASE="${{ secrets.CHROMA_DATABASE }}" \
            WEBSITES_PORT=8000 \
            ENVIRONMENT=production

    - name: Configure Auto-scaling
      run: |
        # Create autoscale settings
        az monitor autoscale create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --resource ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-type Microsoft.Web/sites \
          --name ${{ env.AZURE_WEBAPP_NAME }}-autoscale \
          --min-count 2 \
          --max-count 10 \
          --count 2

        # Scale out rule
        az monitor autoscale rule create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --autoscale-name ${{ env.AZURE_WEBAPP_NAME }}-autoscale \
          --condition "Percentage CPU > 70 avg 5m" \
          --scale out 2

        # Scale in rule
        az monitor autoscale rule create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --autoscale-name ${{ env.AZURE_WEBAPP_NAME }}-autoscale \
          --condition "Percentage CPU < 30 avg 5m" \
          --scale in 1

    - name: Test Production Deployment
      run: |
        # Wait for app to start
        sleep 90

        # Test health endpoint
        PRODUCTION_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        echo "Testing production deployment at: $PRODUCTION_URL"

        curl -f "$PRODUCTION_URL/health" || exit 1
        echo "✅ Production deployment successful!"

        # Test ingest endpoint
        curl -X POST "$PRODUCTION_URL/ingest?test=true" \
          -H "Authorization: Bearer ${{ secrets.BEARER_TOKEN_PRODUCTION }}" \
          -H "Content-Type: application/json" \
          -d '{
            "platform": "GitHub",
            "source": "Actions",
            "id": "deploy-test-${{ github.sha }}",
            "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
            "deeplink": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "author": "https://github.com/${{ github.actor }}",
            "title": "Deployment Test",
            "body": "Test ingest from GitHub Actions deployment",
            "isComment": false
          }' || exit 1

        echo "✅ Ingest test successful!"

    - name: Create GitHub Deployment
      uses: actions/github-script@v6
      with:
        script: |
          const { owner, repo } = context.repo;
          const production_url = "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net";

          await github.rest.repos.createDeployment({
            owner,
            repo,
            ref: context.sha,
            environment: 'production',
            description: 'Deployed to Azure App Service',
            auto_merge: false,
            required_contexts: []
          });

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [build-and-deploy-staging, build-and-deploy-production]
    if: always()

    steps:
    - name: Notify Success
      if: needs.build-and-deploy-production.result == 'success' || needs.build-and-deploy-staging.result == 'success'
      run: |
        echo "🎉 Deployment successful!"
        echo "Production URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        echo "Staging URL: https://${{ env.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net"

    - name: Notify Failure
      if: needs.build-and-deploy-production.result == 'failure' || needs.build-and-deploy-staging.result == 'failure'
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs for more details."
        exit 1