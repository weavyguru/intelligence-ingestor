# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - ingestor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-deps --force-reinstall --pre chromadb==0.4.22
          pip install -r requirements.txt

      - name: Test application imports
        run: |
          python -c "
          import sys
          try:
              print('Testing FastAPI import...')
              from fastapi import FastAPI
              print('✅ FastAPI imported successfully')

              print('Testing main app import...')
              from main import app
              print('✅ Main app imported successfully')

              print('Testing utils imports...')
              from utils.chroma_client import chroma_manager
              from utils.chunking import chunker
              print('✅ All imports successful')

          except Exception as e:
              print(f'❌ Import failed: {e}')
              import traceback
              traceback.print_exc()
              sys.exit(1)
          "

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        id: deploy-to-webapp
        with:
          app-name: 'ingestor'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_62C165B5F30A4E3D914065536048FB8E }}
          package: .
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN_PRODUCTION }}
          CHROMA_API_KEY: ${{ secrets.CHROMA_API_KEY }}
          CHROMA_TENANT: ${{ secrets.CHROMA_TENANT }}
          CHROMA_DATABASE: ${{ secrets.CHROMA_DATABASE }}