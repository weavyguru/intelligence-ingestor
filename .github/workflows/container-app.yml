name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_LOGIN_SERVER }}/intelligence-ingestor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          registryUrl: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}
          containerAppName: intelligence-ingestor-ca
          resourceGroup: internal
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/intelligence-ingestor:${{ github.sha }}
          environmentVariables: |
            BEARER_TOKEN=${{ secrets.BEARER_TOKEN }}
            CHROMA_API_KEY=${{ secrets.CHROMA_API_KEY }}
            CHROMA_TENANT=${{ secrets.CHROMA_TENANT }}
            CHROMA_DATABASE=${{ secrets.CHROMA_DATABASE }}